<style>

  body { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;

  button { width:100%; margin-top:12px; font:inherit; font-weight:600; color:#fff; background:var(--accent);

  button:disabled { opacity:.6; cursor:default; }
  .msg { min-height:20px; margin-top:10px; font-size:14px; color:var(--err); }
  .hidden { display:none; }
</style>

<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  var STORE = 'site-key:' + P.s;
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg');

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }
  function get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function put(v) { try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch (e) {} }

  function derive(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.s), iterations: P.i, hash: 'SHA-256' }, k, 256); });
  }
  function open(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.v) }, k, b64(P.c)); })
      .then(function (plain) {
        var html = new TextDecoder().decode(plain);
        // 页面还在解析时 document.open 不会清空，内容会接在密码页后面，所以等加载完再换
        return new Promise(function (done) {
          function swap() { document.open(); document.write(html); document.close(); done(); }
          if (document.readyState === 'complete') swap();
          else window.addEventListener('load', function () { setTimeout(swap, 0); }, { once: true });
        });
      });
  }

  var saved = get();
  if (saved) open(b64(saved)).catch(function () { put(null); f.classList.remove('hidden'); pw.focus(); });
  else f.classList.remove('hidden');

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true; msg.textContent = '';
    var raw;
    derive(pw.value.trim().toLowerCase())
      .then(function (r) { raw = r; return crypto.subtle.importKey('raw', r, 'AES-GCM', false, ['decrypt']); })
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.v) }, k, b64(P.c)); })
      .then(function () { put(toB64(raw)); return open(raw); })
      .catch(function () { go.disabled = false; msg.textContent = 'Wrong password. Try again.'; pw.select(); });
  });
})();
</script>
